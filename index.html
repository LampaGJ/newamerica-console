<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>New America research console</title>
<link rel="stylesheet" href="console.css?v=73">
</head>
<body>
<main class="wrap" id="out"></main>
<footer class="composer">
  <div class="wrap">
    <form id="ask" class="ask">
      <label for="q" class="sr">Research question</label>
      <p id="signin" class="preview-note signin-note" hidden><a id="signin-btn" class="pill signin-btn" href="#">Sign in with GitHub</a></p>
      <p id="whoami" class="preview-note" hidden><span id="who-name"></span> <button id="signout" class="link-btn" type="button">Sign out</button></p>
      <p id="preview" class="preview-note" role="status" hidden></p>
      <div class="box">
        <i class="ico ico--spark" aria-hidden="true"></i>
        <textarea id="q" rows="1" placeholder="Ask about New America"></textarea>
        <span id="dot" class="dot" role="status" title="Checking the server"></span>
        <button id="go" class="pill" type="submit"><span>Ask</span><i class="ico ico--send" aria-hidden="true"></i></button>
      </div>
      <p id="stats" class="preview-note" hidden></p>
      <p id="offline" class="offline-note" role="status" aria-live="polite" hidden></p>

    </form>
  </div>
</footer>
<script src="chart-theme.js?v=73"></script>
<script src="chart.js?v=73"></script>
<script src="chart-marks.js?v=73"></script>
<script src="chart-export.js?v=73"></script>
<script src="cards-base.js?v=73"></script>
<script src="cards-sources.js?v=73"></script>
<script src="cards-answers.js?v=73"></script>
<script src="cards-research.js?v=73"></script>
<script src="cards-kinds.js?v=73"></script>
<script src="console.js?v=73"></script>
</body>
</html>
