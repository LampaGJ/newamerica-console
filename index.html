<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>New America research console</title>
<link rel="stylesheet" href="console.css?v=4">
</head>
<body>
<header class="wrap">
  <h1>New America research console</h1>
  <p class="lede">Runs against an index of newamerica.org on the maintainer's machine; results link to the originals.</p>
  <details id="settings">
    <summary>Settings</summary>
    <label>Server URL <input id="server" type="url" placeholder="https://your-host.ts.net/newamerica-mcp" autocomplete="off"></label>
    <label>Token <input id="token" type="password" autocomplete="off"></label>
    <div class="row"><button id="test" type="button">Test connection</button><span id="testout" role="status"></span></div>
  </details>
  <form id="ask" class="ask">
    <label for="q" class="sr">Research question</label>
    <textarea id="q" rows="3" placeholder="What has New America published on broadband affordability?"></textarea>
    <button id="go" type="submit">Ask</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
</header>
<main class="wrap" id="out"></main>
<script src="console.js?v=4"></script>
</body>
</html>
